services:
  - type: web
    name: fpv-drone-builder
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: SITE_URL
        value: https://buildyourownfpv.com
      - key: ALLOWED_ORIGINS
        value: https://buildyourownfpv.com
